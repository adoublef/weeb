[package]
name = "weeb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-read-length-limit = "0.1.3"
async-stream = "0.3.6"
async_zip = { version = "0.0.18", features = ["chrono", "deflate", "tokio"] }
async_zip_futures = { version = "0.0.13", features = ["chrono"] }
axum = "0.8.8"
bytes = "1.11.1"
chrono = "0.4.44"
futures = "0.3.32"
futures-copy = "0.3.1"
futures-util = { version = "0.3.32", features = ["alloc", "io", "std"] }
html5gum = "0.8.3"
http = "1.4.0"
http-body-util = "0.1.3"
io-pipe = { version = "0.7.3", features = ["async"] }
maud = { version = "0.27.0", features = ["axum"] }
mime = "0.3.17"
mimetype-detector = "0.3.7"
rc-zip-tokio = "4.3.1"
reqwest = { version = "0.13.2", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["io-util", "rt-multi-thread"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["io", "io-util"] }
tower-http = { version = "0.6.8", features = ["fs"] }
url = { version = "2.5.8", features = ["serde"] }

[[bench]]
name = "handle_zip"
harness = false

[dev-dependencies]
divan = "0.1.21"
